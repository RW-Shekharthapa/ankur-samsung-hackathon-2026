<main class="wrap">
  <form class="card" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>
    <p class="hint">Demo: admin&#64;example.com / password123</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit">Sign in</button>
  </form>
</main>
